name: Release

# Triggers when you push a tag of the form vX.Y.Z (e.g. ``git tag v1.2.0 && git push --tags``).
# Builds an sdist + wheel, runs ``twine check``, and uploads to PyPI using
# OIDC-based Trusted Publishing -- no API token needs to be stored as a secret.
#
# One-time PyPI setup (already-claimed projects):
#   1. Sign in at https://pypi.org/manage/account/publishing/
#   2. Under "Add a new pending publisher" choose the existing ``qutritium`` project
#      and fill in:
#        Owner:        spham1611
#        Repo:         qutritium
#        Workflow:     release.yml
#        Environment:  pypi   (matches the ``environment:`` key below; optional but recommended)
#   3. Save. The very first tag push after that completes the binding.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} (=${TAG_VERSION}) does not match pyproject version ${PY_VERSION}." >&2
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Check artifacts
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qutritium
    permissions:
      id-token: write  # required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
