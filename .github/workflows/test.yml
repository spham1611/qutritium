name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot]"

      - name: Verify package imports cleanly
        run: |
          python -c "import qutritium; print('qutritium', qutritium.__version__)"
          python -c "from qutritium.circuit import QutritCircuit"
          python -c "from qutritium.simulator import QASMSimulator"
          python -c "from qutritium.gates import H3, X12, CSUM, Rx01"
          python -c "from qutritium.decomposition import SU3Decomposition"

      - name: Run tests with coverage
        run: pytest test/ --cov=src/qutritium --cov-report=term-missing -v